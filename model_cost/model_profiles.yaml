#
# Model price profiles: the source of truth for model_cost/model_cost.json.
# One entry per model, keyed by its OpenRouter id when OpenRouter lists the model.
# Every other spelling a submission uses (provider prefix, date, effort suffix such as
# @high) is an alias. After editing, regenerate the JSON with:
#   python scripts/pricing/build_model_cost.py
#
# Fields
#   price.input / price.output  USD per 1M tokens (required)
#   aliases                     other spellings of the same model; they share its price
#   as_of                       date the price was recorded
#   source                      URL of the published price (required for new models)
#   note                        free text, e.g. known conflicts to resolve
#   openrouter_id               OpenRouter id to sync from, when the key isn't one
#   sync                        false keeps the price fixed (retired or never-listed models)
#
# Profiles keyed by an OpenRouter id (or with openrouter_id) take OpenRouter's list price
# when a maintainer runs:
#   python scripts/pricing/sync_openrouter.py
# which also records the prices used in model_cost/price_snapshots/<date>.json. A model
# name that matches no id or alias is charged the highest price in this file.

