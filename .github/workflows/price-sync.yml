name: Price sync

# Daily sync of model_cost/model_profiles.yaml with OpenRouter's list prices.
# Every run records model_cost/price_snapshots/<date>.json; when a price changed, the
# profiles and model_cost.json are updated as well. The result is proposed as a pull
# request (one branch, updated in place) for a maintainer to review. Leaderboard costs
# only change when the routers are re-priced, as a separate step.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: price-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Sync prices from OpenRouter
        id: sync
        run: |
          set -euo pipefail
          today=$(date -u +%F)
          python scripts/pricing/sync_openrouter.py --date "$today" --report price-sync-report.md
          echo "date=$today" >> "$GITHUB_OUTPUT"

      - name: Open or update the price-sync pull request
        uses: peter-evans/create-pull-request@v7
        with:
          # A personal token lets CI run on the PR; GITHUB_TOKEN-created PRs skip it.
          token: ${{ secrets.PRICE_SYNC_TOKEN || github.token }}
          branch: price-sync/auto
          delete-branch: true
          add-paths: |
            model_cost/model_profiles.yaml
            model_cost/model_cost.json
            model_cost/price_snapshots/*.json
          commit-message: "Price sync with OpenRouter (${{ steps.sync.outputs.date }})"
          title: "Price sync with OpenRouter (${{ steps.sync.outputs.date }})"
          body-path: price-sync-report.md
          labels: pricing
