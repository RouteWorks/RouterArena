#
# Single source of truth for the RouterArena leaderboard.
#
# Each entry keys off the prediction-file basename in
# router_inference/predictions/<router>.json. `scripts/website/build_site_data.py`
# reads this together with the evaluated prediction files to regenerate both the
# README leaderboard table and the website's src/data JSONs.
#
# Headline metrics (arena / accuracy / cost / robustness, and the per-query flip
# labels) are computed from the prediction files. Fields that the pipeline does
# not yet compute automatically (optimality, latency) are curated here until the
# build script computes them too.
#
# website_key  -> flip_labels_<website_key>.json + category_scores key
# on_leaderboard: false hides a router without deleting its data.

routers:
  sqwish-router:
    display_name: "Sqwish Router"
    website_key: "sqwish-router"
    affiliation: ""
